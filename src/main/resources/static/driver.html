<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILLEGO - Panel del Conductor</title>
    <!-- Enlace a tu propio archivo CSS local -->
    <link rel="stylesheet" href="css/driver.css">
</head>
<body>

<!-- Header / Estado de la Sesión -->
<header>
    <h1>ILLEGO - Conductor</h1>
    <div class="status-bar">
        <span>Estado GPS: <strong id="gps-status" style="color: #fde047;">Buscando...</strong></span>
        <span>Velocidad: <strong id="speed-display">0 km/h</strong></span>
    </div>
</header>

<!-- Contenido Principal -->
<main>

    <!-- Selección de Ruta / Unidad Asignada -->
    <div class="card-route">
        <h2>Asignación actual:</h2>
        <select id="route-select">
            <option value="">Cargando rutas asignadas...</option>
        </select>
    </div>

    <!-- Panel de Control del Viaje (Botones Grandes) -->
    <div class="controls">
        <button id="btn-start" class="btn-action btn-start" onclick="startTrip()">
            INICIAR TURNO / VIAJE
        </button>

        <button id="btn-end" class="btn-action btn-end" onclick="endTrip()" disabled>
            TERMINAR VIAJE
        </button>
    </div>

    <!-- Consola de Estado / Log para depurar -->
    <div id="log-box" class="log-box">
        [Sistema] Esperando acción del conductor...
    </div>

</main>

<!-- Footer -->
<footer>
    ILLEGO Telemetry System &copy; 2026
</footer>

<!-- Script de lógica -->
<script src="/js/driver.js"></script>
</body>
</html>
